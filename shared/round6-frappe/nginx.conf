pid /tmp/frappe-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  access_log /dev/stdout;
  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path /tmp/nginx-proxy;
  map $http_x_forwarded_proto $forwarded_proto { default $scheme; https https; }
  server {
    listen __PORT__;
    listen [::]:__PORT__;
    server_name _;
    root /home/frappe/frappe-bench/sites;
    client_max_body_size 50m;
    location /assets/ { try_files $uri =404; }
    location ~ ^/protected/(.*) { internal; try_files /__SITE__/$1 =404; }
    location /socket.io {
      proxy_pass http://127.0.0.1:9000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Frappe-Site-Name __SITE__;
      proxy_set_header Host $host;
      proxy_set_header Origin $forwarded_proto://$host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
    location / {
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header X-Frappe-Site-Name __SITE__;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Use-X-Accel-Redirect True;
      proxy_read_timeout 120s;
    }
  }
}
